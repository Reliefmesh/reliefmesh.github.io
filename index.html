<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReliefMesh App Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a showcase stage (screen index · live phone · notes on what the screen does). The phone shows the app; its colours are fixed, since it depicts the product. */
:root{
  --bg:#EEF4F0; --surface:#FFFFFF; --ink:#12261A; --muted:#4A5F52; --line:#D2E0D6; --accent:#15774A; --accent-ink:#FFFFFF; --chip:#E1F0E6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  /* the app's own palette (fixed, single theme) */
  --a-bg:#FFFFFF; --a-soft:#F2F8F4; --a-mint:#DCF1E3; --a-line:#DCE7E0; --a-ink:#11281B; --a-sub:#4B6154;
  --a-g:#17804D; --a-gd:#0E5A35; --a-red:#C62F1E; --a-redsoft:#FCEAE7; --a-amb:#F2B300; --a-ambsoft:#FFF4D2; --a-ambink:#6E4E00;
  --a-done:#1E8A55; --a-map:#E8F0EA; --a-block:#DAE6DD; --a-water:#B7D8EE; --a-bezel:#121714;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0D1611; --surface:#14211A; --ink:#E4EFE8; --muted:#9DB4A6; --line:#26392E; --accent:#4CC48A; --accent-ink:#06210F; --chip:#1C3326; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0D1611; --surface:#14211A; --ink:#E4EFE8; --muted:#9DB4A6; --line:#26392E; --accent:#4CC48A; --accent-ink:#06210F; --chip:#1C3326; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 48px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- showcase ---------- */
.top{max-width:1320px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:26px;height:26px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted)}
.rolebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rolebox span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px 404px minmax(0,1fr);gap:28px;align-items:start}
.index{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.index h2,.notes h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
.index button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.index button:hover{background:var(--chip)}
.index button[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.index .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px}
.phone-wrap{position:relative}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;min-width:0}
.notes h3{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 6px;line-height:1.1;text-wrap:balance}
.notes .lead{color:var(--ink);margin:0 0 16px;max-width:62ch}
.notes h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px}
.notes p{margin:0;max-width:62ch}
.ctl{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:8px 14px;margin:0}
.ctl dt{font-weight:700}
.ctl dd{margin:0;color:var(--muted)}
.try{margin-top:18px;background:var(--chip);border-radius:12px;padding:12px 14px}
.try b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.sample{margin-top:14px;font-size:13px;color:var(--muted)}
@media (max-width:1180px){
  .stage{grid-template-columns:404px minmax(0,1fr)}
  .index{position:static;grid-column:1/-1;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .index h2{display:none}
  .index button{white-space:nowrap;flex:none;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .index button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
  .index button[aria-current="true"] .n{color:inherit}
}
@media (max-width:800px){ .stage{grid-template-columns:minmax(0,1fr)} .phone-wrap{margin:0 auto} .ctl{grid-template-columns:minmax(0,1fr)} .ctl dd{margin-bottom:6px} }

/* shot mode (PNG export) */
html.shot,html.shot body{background:transparent}
html.shot body{padding:0}
html.shot .top,html.shot .index,html.shot .notes{display:none}
html.shot .stage{display:block}

/* ---------- phone ---------- */
.phone{width:404px;height:844px;border:12px solid var(--a-bezel);border-radius:52px;background:var(--a-bezel);position:relative;transform-origin:top left;box-shadow:0 30px 60px -30px rgba(10,40,25,.45)}
.phone.bare{width:380px;height:820px;border-width:0;border-radius:28px;box-shadow:0 10px 30px -12px rgba(10,40,25,.4)}
.phone.bare .screen{border-radius:28px}
.screen{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:var(--a-bg);color:var(--a-ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column}
.screen .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:13px;font-weight:700;position:relative;background:var(--a-bg)}
.sb .cam{position:absolute;left:50%;top:8px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#0B0F0C}
.sb .r{display:flex;gap:6px;align-items:center}
.sb .ic{width:15px;height:15px}
.sb-sos{background:var(--a-red);color:#fff}
.ab{height:56px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;background:var(--a-bg)}
.ab h2{font-size:20px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--a-ink)}
.ibtn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--a-ink)}
.ibtn:hover{background:var(--a-soft)}
.mesh-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--a-mint);color:var(--a-gd);padding:5px 9px;border-radius:999px}
.mesh-chip .ic{width:15px;height:15px}
.sos-btn{border:0;background:var(--a-red);color:#fff;font-weight:700;font-size:14px;letter-spacing:.06em;height:36px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:44px}
.sos-btn .ic{width:16px;height:16px}
.content{flex:1;min-height:0;position:relative;background:var(--a-bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.nav{height:68px;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--a-line);background:var(--a-bg)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--a-sub);cursor:pointer;position:relative}
.nav .pillw{width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
.nav button[aria-current="page"]{color:var(--a-gd)}
.nav button[aria-current="page"] .pillw{background:var(--a-mint)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--a-red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.gest{height:16px;flex:none;display:grid;place-items:center;background:var(--a-bg)}
.gest i{width:110px;height:4px;border-radius:2px;background:#1B2A20;display:block}

/* shared app pieces */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-ink);border-radius:10px;height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;cursor:pointer}
.chip .ic{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--a-mint);border-color:var(--a-g);color:var(--a-gd)}
.btn{border:0;border-radius:999px;height:48px;padding:0 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn .ic{width:19px;height:19px}
.btn-p{background:var(--a-g);color:#fff}
.btn-p:hover{background:var(--a-gd)}
.btn-o{background:var(--a-bg);color:var(--a-gd);box-shadow:inset 0 0 0 1.5px var(--a-g)}
.btn-t{background:transparent;color:var(--a-gd);padding:0 10px}
.btn-r{background:var(--a-red);color:#fff}
.btn[disabled]{background:#E3E8E5;color:#5E6E64;cursor:not-allowed;box-shadow:none}
.wide{width:100%}
.card{background:var(--a-bg);border:1px solid var(--a-line);border-radius:16px;padding:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a-sub)}
.mono{font-family:var(--mono);font-size:12px}
.sp{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px 4px 8px}
.status i{width:9px;height:9px;border-radius:50%;display:block}
.st-red{background:var(--a-redsoft);color:#9A2214}.st-red i{background:var(--a-red)}
.st-amb{background:var(--a-ambsoft);color:var(--a-ambink)}.st-amb i{background:var(--a-amb)}
.st-grn{background:var(--a-mint);color:var(--a-gd)}.st-grn i{background:var(--a-done)}
.toggle{width:52px;height:32px;border-radius:16px;border:2px solid #74867A;background:#E6EDE8;position:relative;cursor:pointer;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:#74867A;transition:all .15s}
.toggle[aria-checked="true"]{background:var(--a-g);border-color:var(--a-g)}
.toggle[aria-checked="true"]::after{left:23px;top:3px;width:22px;height:22px;background:#fff}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sub{color:var(--a-sub);font-size:13px}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--a-mint);color:var(--a-gd)}
.toast{position:absolute;left:12px;right:12px;bottom:84px;background:#17261D;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;z-index:40;animation:tin .2s ease-out}
.toast .ic{color:#7FDCA9}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* map */
.map{position:absolute;inset:0;overflow:hidden;background:var(--a-map)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:38px;height:46px;border:0;background:transparent;padding:0;transform:translate(-50%,-100%);cursor:pointer;z-index:3}
.pin .h{position:absolute;left:3px;top:0;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 4px rgba(0,0,0,.25);border:2.5px solid #fff}
.pin .g{position:absolute;left:3px;top:0;width:32px;height:32px;display:grid;place-items:center;color:#fff}
.pin .g .ic{width:17px;height:17px;stroke-width:2.6}
.pin.red .h{background:var(--a-red)} .pin.amb .h{background:var(--a-amb)} .pin.amb .g{color:#3D2B00} .pin.grn .h{background:var(--a-done)}
.pin .k{position:absolute;right:-1px;top:-4px;width:17px;height:17px;border-radius:50%;background:#fff;color:var(--a-ink);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.pin .k .ic{width:11px;height:11px;stroke-width:3}
.pin.sel .h{border-color:var(--a-ink);transform:rotate(-45deg) scale(1.15)}
.pin.dim{opacity:.25}
.pulse{position:absolute;left:19px;top:16px;width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(198,47,30,.35);animation:pp 1.8s ease-out infinite;z-index:-1}
@keyframes pp{to{transform:scale(6);opacity:0}}
.me{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--a-gd);border:3px solid #fff;box-shadow:0 0 0 8px rgba(14,90,53,.18);z-index:4;transition:left 2.2s ease-in-out, top 2.2s ease-in-out}
.melbl{position:absolute;font-size:11px;font-weight:700;background:#fff;padding:1px 6px;border-radius:6px;transform:translate(-50%,14px);z-index:4;white-space:nowrap;transition:left 2.2s ease-in-out, top 2.2s ease-in-out}
.mtop{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;z-index:6;display:flex;flex-direction:column;gap:8px}
.mtop .chip{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.offl{align-self:flex-start;background:rgba(255,255,255,.95);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--a-sub)}
.offl b{color:var(--a-gd)}
.offl .ic{width:14px;height:14px}
.legend{position:absolute;left:12px;bottom:14px;z-index:5;background:rgba(255,255,255,.96);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.fab{position:absolute;right:14px;bottom:14px;z-index:5;height:56px;border-radius:18px;border:0;background:var(--a-g);color:#fff;font-weight:700;font-size:15px;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 10px rgba(14,90,53,.35);cursor:pointer}
.fab .ic{width:24px;height:24px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--a-bg);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:6px 16px 16px;max-height:94%;overflow-y:auto;animation:sup .22s ease-out;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes sup{from{transform:translateY(40px);opacity:.4}}
.handle{width:36px;height:4px;border-radius:2px;background:#B9C7BE;margin:4px auto 10px}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:9px 10px;font-size:14px;margin:12px 0}
.kv dt{color:var(--a-sub)}
.kv dd{margin:0;font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.kv dd .ic{width:17px;height:17px;color:var(--a-g)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:6px 0 12px}
.steps div{font-size:12px;font-weight:700;color:var(--a-sub);display:flex;flex-direction:column;gap:5px}
.steps div::before{content:"";height:5px;border-radius:3px;background:var(--a-line)}
.steps .on{color:var(--a-ink)} .steps .on.s1::before{background:var(--a-red)} .steps .on.s2::before{background:var(--a-amb)} .steps .on.s3::before{background:var(--a-done)}
.warn{background:var(--a-redsoft);color:#8A1E11;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.warn .ic{color:var(--a-red);margin-top:1px}
.okline{background:var(--a-mint);color:var(--a-gd);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(10,25,16,.45);z-index:19;border:0;width:100%;cursor:pointer}

/* lists */
.req{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--a-line);background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;align-items:flex-start}
.req .tile.red{background:var(--a-redsoft);color:var(--a-red)} .req .tile.amb{background:var(--a-ambsoft);color:var(--a-ambink)} .req .tile.grn{background:var(--a-mint);color:var(--a-gd)}
.req h3{font-size:15px;margin:0 0 3px;line-height:1.3}
.req .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;border-bottom:1px solid var(--a-line);padding:0 8px;background:var(--a-bg)}
.tabs button{flex:1;border:0;background:transparent;height:46px;font-weight:700;font-size:14px;color:var(--a-sub);cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--a-gd);border-bottom-color:var(--a-g)}
.tabs .c{font-family:var(--mono);font-size:11px;margin-left:4px}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl2{font-size:14px;font-weight:700}
.input{border:1.5px solid #9DB0A3;border-radius:12px;padding:12px;font:inherit;font-size:15px;background:var(--a-bg);color:var(--a-ink);width:100%}
.input:focus{outline:none;border-color:var(--a-g);box-shadow:0 0 0 3px rgba(23,128,77,.2)}
textarea.input{resize:none;height:76px}
.typegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.typegrid button{border:1.5px solid var(--a-line);background:var(--a-bg);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;cursor:pointer;color:var(--a-ink)}
.typegrid button[aria-pressed="true"]{border-color:var(--a-g);background:var(--a-mint);color:var(--a-gd)}
.dup{border:2px solid var(--a-amb);background:var(--a-ambsoft);border-radius:16px;padding:12px}
.dup h3{margin:0;font-size:15px;color:var(--a-ambink);display:flex;gap:8px;align-items:center}
.dup .match{background:var(--a-bg);border-radius:12px;padding:10px;margin:10px 0;display:flex;gap:10px}
.bar{height:6px;border-radius:3px;background:#E3D2A0;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--a-amb)}

/* stock */
.stock{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--a-line)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--a-line);border-radius:999px;height:44px}
.stepper button{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--a-gd)}
.stepper button:hover{background:var(--a-soft)}
.stepper output{min-width:40px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px}
.need{font-size:12px;font-weight:700;margin-top:3px}
.need.short{color:#A42716}.need.ok{color:var(--a-gd)}
.hero{background:var(--a-gd);color:#fff;border-radius:18px;padding:14px 16px}
.hero .big{font-size:26px;font-weight:700;line-height:1.1;margin:2px 0}
.hero .sub{color:#CDEBD9}

/* team */
.vol{position:absolute;z-index:4;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.vol .av{width:30px;height:30px;border-radius:50%;background:var(--a-g);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.vol.stale .av{background:#8A968E}

.msg .who{font-size:12px;font-weight:700;color:var(--a-sub);padding-left:4px}
.msg .b{background:var(--a-soft);border:1px solid var(--a-line);border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:14.5px}

.msg.mine .b{background:var(--a-g);color:#fff;border:0;border-radius:16px 4px 16px 16px}
.msg.mine .m{justify-content:flex-end;padding-right:4px}
.msg.pri .b{background:var(--a-redsoft);border-color:#F0B9B0}
.msg.mine.pri .b{background:var(--a-red);color:#fff}

.compose input{flex:1;height:46px;border-radius:999px;border:1.5px solid #9DB0A3;padding:0 16px;font:inherit;background:var(--a-bg);color:var(--a-ink);min-width:0}

.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--a-g);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}

.sosact{position:absolute;inset:0;background:var(--a-red);color:#fff;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;text-align:center}

.btn-w{background:#fff;color:#8E1D10}
.btn-wo{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}

.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--a-line);border-radius:16px}

.step p{margin:0;font-size:16.5px;line-height:1.35}
.step.dont .num{background:var(--a-redsoft);color:var(--a-red)}
.metro{display:flex;align-items:center;gap:14px;background:var(--a-soft);border-radius:16px;padding:12px}

.beat.go{animation:beat .545s ease-out infinite}

.ditem{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;height:46px;border-radius:999px;padding:0 14px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--a-ink);text-align:left}

.dsec{font-size:12px;font-weight:700;color:var(--a-sub);text-transform:uppercase;letter-spacing:.08em;padding:12px 14px 4px}
.dfoot{border-top:1px solid var(--a-line);padding:12px 18px;font-size:12.5px;color:var(--a-sub);display:flex;flex-direction:column;gap:4px}

/* SOS hold */
function wireSOS(){
  const b=document.getElementById('sosBtn'), p=document.getElementById('sosProg'), hint=document.getElementById('sosHint'); let t0=0, raf=0;
  const C=678.6;
  function tick(){ const k=Math.min(1,(performance.now()-t0)/3000); p.style.strokeDashoffset=C*(1-k); hint.textContent=k<1?'Keep holding… '+Math.ceil(3-k*3):'Sending'; if(k>=1){ fire(); return; } raf=requestAnimationFrame(tick); }
  function start(e){ if(t0) return; if(e) e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(tick); }
  function stop(){ if(!t0) return; cancelAnimationFrame(raf); t0=0; p.style.strokeDashoffset=C; hint.textContent='Hold to send'; }
  function fire(){ t0=0; S.sos='active'; S.sosAck=false; render(); screenEl.classList.add('buzz'); setTimeout(()=>screenEl.classList.remove('buzz'),1000); setTimeout(()=>{ if(S.sos==='active'){ S.sosAck=true; render(); } },1800); }
  b.addEventListener('pointerdown',start); b.addEventListener('contextmenu',e=>e.preventDefault()); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat) start(e); });
  b.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') stop(); });
}

screenEl.addEventListener('submit', e=>{ e.preventDefault(); const f=e.target.dataset.form; const inp=e.target.querySelector('input'); const v=inp.value.trim(); if(!v) return;
  if(f==='chat'){ botAsk(v); const n=document.getElementById('chatIn'); if(n) n.focus(); return; }
  const m={from:me(),text:v,t:'14:32',via:'1 hop',status:'queued'}; S.msgs.push(m); render(); document.getElementById('meshIn').focus();
  setTimeout(()=>{ m.status='relay'; if(S.screen==='mesh') render(); },1000); setTimeout(()=>{ m.status=null; if(S.screen==='mesh') render(); },2400); });

/* ---------- showcase: index + notes ---------- */
const SHOTS=[
 ['map','Relief map'],['card','Request card'],['requests','Request list'],['report','New report & duplicates'],['inventory','Stock & supplies'],['team','Team tracking'],['mesh','Mesh messages'],['sos','SOS alarm'],['sosactive','SOS active'],['firstaid','First aid (20)'],['guide','First aid steps'],['hazards','Danger zones'],['hazalert','Danger zone alert'],['privacy','Privacy mode'],['assistant','Helper chatbot'],['drawer','Sidebar menu']
];
function setup(id){
  S.drawer=false; S.sel=null; S.hazAlert=false; S.markMode=false; S.walked=false; S.sosConfirm=false; stopBeat();
  if(S.sos==='active'&&id!=='sosactive') S.sos='idle';
  switch(id){
    case 'card': S.screen='map'; S.sel='REQ-0412'; break;
    case 'sosactive': S.screen='sos'; S.sos='active'; S.sosAck=true; break;
    case 'hazalert': S.screen='hazards'; S.walked=true; S.hazAlert=true; break;
    case 'drawer': S.screen='map'; S.drawer=true; break;
    case 'guide': S.screen='guide'; S.fa='cpr'; break;
    default: S.screen=id;
  }
  render();
}

 map:{t:'Relief map',p:'The home screen. Every request is a pin on a map stored on the phone, colored by status.',u:'Su Su starts her shift with no signal. Red pins show who still needs help. She filters to Clean water to plan the water truck’s route, with flooded roads hatched in red.',c:[['Red, yellow, green pins','Urgent and unassigned, in progress, resolved. Each pin also has a symbol (!, clock, tick) so status reads without relying on colour.'],['Type chips','Filter pins by Water, Food, Medical or Shelter.'],['Danger zones chip','Shows or hides hazard areas.'],['Report need','Opens the new request form.'],['SOS (top right)','On every screen, one tap from the SOS alarm.'],['Mesh count (4)','Phones in range right now.']],o:'Map, pins and edits are stored on the phone. Changes pass to nearby phones over mesh and sync to the server when any phone finds internet.',try:'Tap any pin to open its card.'},

 report:{t:'New report & duplicate check',p:'A short form for a new need, with a check for repeat reports.',u:'A volunteer reports that Lane 4 has no clean water. The app sees REQ-0412, same need and street, 40 m away, and suggests merging instead of creating a second pin.',c:[['Need type','Four large buttons: Clean water, Food, Medical, Shelter.'],['Location','From GPS, which works without internet. Adjust if needed.'],['Repeat report card','Shows the likely match and why. Add to it, or mark as not a repeat.'],['Urgent switch','Makes it a red pin for everyone.'],['Save and share on mesh','Saves on the phone, then sends to nearby phones.']],o:'The duplicate check runs on the phone, against every request the phone has seen.',try:'Change the need type to Food: the repeat warning goes away. Tap Add to REQ-0412 to merge.'},

 team:{t:'Team tracking',p:'Coordinators see where each volunteer is, how fresh that position is and their battery. Volunteers control their own sharing.',u:'Ko Min has been out of range for 18 minutes. His last known spot is restored from Su Su’s phone storage and shown in grey, so she knows where to start looking.',c:[['Live / last known','Green avatars are live over mesh. Grey ones show the last position saved on the phone.'],['Trails','Dotted lines show the recent path.'],['Battery','Low batteries in red.'],['Ping all','Asks every phone in range for a fresh position.'],['Volunteer view','Share on/off, how often, and who can see it.']],o:'Positions hop over mesh. When nobody is in range they wait on the phone and send later.',try:'Switch to Volunteer to see the My location screen.'},
 mesh:{t:'Mesh messages',p:'Team chat that goes phone to phone over Bluetooth and Wi-Fi Direct, without towers or internet.',u:'Su Su warns everyone that Bridge 5 is cracked. Her message hops through the monastery-roof relay phone to reach Ko Min 3 hops away.',c:[['Range view','Phones and relays nearby, with hop lines.'],['Priority messages','Coordinator warnings are tinted red.'],['Delivery status','Waiting for a nearby phone, passed on, delivered.'],['Message box','Type and send.']],o:'Messages are stored on each phone and passed along until they reach everyone on the team.',try:'Send a message and watch it go from waiting to delivered.'},

function renderIndex(){
  const cur=viewId(); const el=document.getElementById('index');
  el.innerHTML='<h2>Screens</h2>'+SHOTS.map((s,i)=>'<button type="button" data-shot="'+s[0]+'"'+(cur===s[0]?' aria-current="true"':'')+'><span class="n">'+String(i+1).padStart(2,'0')+'</span>'+s[1]+'</button>').join('');
}
function renderNotes(){
  const n=NOTES[viewId()]||NOTES.map;
  document.getElementById('notes').innerHTML='<h2>'+(S.role==='coordinator'?'Coordinator view':'Volunteer view')+'</h2><h3>'+n.t+'</h3><p class="lead">'+n.p+'</p><h4>Use case</h4><p>'+n.u+'</p><h4>Buttons and controls</h4><dl class="ctl">'+n.c.map(c=>'<dt>'+c[0]+'</dt><dd>'+c[1]+'</dd>').join('')+'</dl><h4>Without internet</h4><p>'+n.o+'</p><div class="try"><b>Try it</b>'+n.try+'</div><p class="sample">All names, places and numbers are sample data.</p>';
}
document.getElementById('index').addEventListener('click',e=>{ const b=e.target.closest('[data-shot]'); if(b) setup(b.dataset.shot); });
document.querySelectorAll('.seg [data-role]').forEach(b=>b.addEventListener('click',()=>{ S.role=b.dataset.role; render(); }));

/* fit phone to narrow screens */
function fit(){ const w=document.getElementById('phoneWrap'), ph=document.getElementById('phone'); if(document.documentElement.classList.contains('shot')){ ph.style.transform=''; w.style.height=''; w.style.width=''; return; }
  const bare=window.innerWidth<560; ph.classList.toggle('bare',bare); const W=bare?380:404, H=bare?820:844;
  const avail=w.parentElement.clientWidth||W; const s=bare?Math.min(1.15, avail/W):Math.min(1, avail/W); ph.style.transform=s!==1?'scale('+s+')':''; w.style.width=(W*s)+'px'; w.style.height=(H*s)+'px'; }
window.addEventListener('resize',fit);

window.RM={ shot(id,role){ document.documentElement.classList.add('shot'); fit(); S.role=role||'coordinator'; S.toast=null; setup(id); }, S, botAsk, setup };
function fromHash(){ const h=(location.hash||'').slice(1); if(SHOTS.some(s=>s[0]===h)) setup(h); }
window.addEventListener('hashchange',fromHash);
render(); fit(); fromHash();
})();
